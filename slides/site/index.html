# Frontend Web Apps for IR

Alex McClung, Yale University

---

## The Problem

***"Can you make this [PDF or PowerPoint] report interactive?"***

- Tools like R Shiny and Python Streamlit:
  - Require specialized infrastructure  
- Tools like Tableau and PowerBI:
  - Struggle with reproducibility
  - Difficult to programmatically generate multiple reports  
  - Less flexible in terms of customization, choice of charting libraries 

---

## Where this approach fits

> A lightweight alternative between non-interactive PDF/PPT reports and "full apps" (Shiny/Streamlit or Tableau/PowerBI)

---

## Concept: Static Web Apps

- Self-contained web apps (HTML, CSS, and JavaScript files)  
- Run entirely in the browser  
- No specialized server, no runtime environment  
- Can include filters, inputs, and interactive visuals  

>This presentation is a static web app built with [MkSlides](https://martenbe.github.io/mkslides/) 🎉

---

## A Key Constraint

- Data is packaged with your app during build time  
- No live queries to databases  
- No real-time updates  

> ⛔ If you need live database interaction, this is not the right tool

---

## The Workflow

### Notebook → Build → GitHub → Deploy

- Data science notebooks: write code (R, Python, JavaScript) + narrative (Markdown)  
- Build/render to HTML, CSS, and JavaScript  
- Push files up to GitHub (or similar)   
- Host or deploy pages right from GitHub repo  


---

## Same app using three approaches

> Example using IPEDS degree completions by level and subgroup

1. [Quarto](https://quarto.org/) + R  
2. [marimo Python](https://docs.marimo.io/) (WebAssembly HTML export)  
3. [Observable Framework](https://observablehq.com/framework/)

## When to use each?

**Quarto**
- Lowest barrier to entry, more work to add interactivity  

**marimo**
- Python-first workflow, WebAssembly still evolving  

**Observable Framework**
- Most interactive and app-like, requires a version of JavaScript  

---

## More on deployment

- Build step in the terminal: `quarto render`, `marimo export`, `npm run build`  

- Output: static files (HTML, CSS, and JavaScript)

- Deploy:
  - GitHub or GitLab Pages (enterprise versions with SSO)
  - From cloud storage (e.g., AWS S3 or Azure Blobs)  
  - Any static hosting (e.g., Netlify or Cloudflare Pages)

> No server required after deployment

---

## Key Takeaways

- You don’t need a specialized server or a Docker container to build interactive tools  
- You don't need expert frontend web development skills to create a real web app
- You can use data science notebooks and GitHub to turn your analysis into an app 
- ⚠️ Static web apps require pre-processed (staged) data
